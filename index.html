<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jednoduchý formulář</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="form-card">
    <h1>Kontaktujte nás</h1>
    <p class="intro">Vyplňte krátký formulář a ozveme se vám.</p>

    <form action="#" method="post">
      <label for="name">Jméno</label>
      <input id="name" name="name" type="text" placeholder="Vaše jméno" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" placeholder="vas@email.cz" required>

      <label for="topic">Téma zprávy</label>
      <select id="topic" name="topic" class="placeholder">
        <option value="" disabled selected hidden>Vyberte téma</option>
        <option value="dotaz">Obecný dotaz</option>
        <option value="spoluprace">Spolupráce</option>
        <option value="jine">Jiné</option>
      </select>

      <fieldset>
        <legend>Jak vám máme odpovědět?</legend>
        <label class="choice">
          <input type="radio" name="reply" value="email" checked>
          E-mailem
        </label>
        <label class="choice">
          <input type="radio" name="reply" value="telefon">
          Telefonicky
        </label>
      </fieldset>

      <label for="message">Zpráva</label>
      <textarea id="message" name="message" rows="5" placeholder="Napište nám..." required></textarea>

      <label class="choice consent">
        <input type="checkbox" name="consent" required>
        Souhlasím se zpracováním osobních údajů.
      </label>

      <button type="submit">Odeslat zprávu</button>
    </form>
  </main>
  <script>
    const topicSelect = document.querySelector("#topic");

    topicSelect.addEventListener("change", () => {
      topicSelect.classList.remove("placeholder");
    });

    topicSelect.addEventListener("blur", () => {
      if (!topicSelect.value) {
        topicSelect.options[0].textContent = "";
      }
    });
  </script>
</body>
</html>
